version: '3.8'
services:
  db:
    image: postgres:15
    container_name: fitness_tracker_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    container_name: fitness_tracker_api
    ports:
      - "5001:5001"
    environment:
      DB_HOST: db
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASS: 123456
      DB_PORT: 5432
    depends_on:
      - db
volumes:
  postgres_data:
